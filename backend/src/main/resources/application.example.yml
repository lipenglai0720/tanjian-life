# Copy to application.yml and configure local credentials or environment variables.
spring:
  application:
    name: tanjian-life
    #配置数据库连接信息
  datasource:
    url: jdbc:mysql://localhost:3306/hmdp
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          time-between-eviction-runs: 10s
      database: 0
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 11MB
mybatis-plus:
  type-aliases-package: com.tanjian.entity # 别名扫描包
logging:
  level:
    com.tanjian: debug
server:
  port: 8081
# 配置ai模型
langchain4j:
  open-ai:
    chat-model:
      base-url: ${AI_BASE_URL:http://127.0.0.1:1/v1}
      api-key: ${DEEPSEEK_API_KEY:local-model-disabled}
      model-name: ${AI_MODEL:local-disabled}
      log-requests: false
      log-responses: false
    streaming-chat-model:
      base-url: ${AI_BASE_URL:http://127.0.0.1:1/v1}
      api-key: ${DEEPSEEK_API_KEY:local-model-disabled}
      model-name: ${AI_MODEL:local-disabled}
      log-requests: false
      log-responses: false
# 图片上传本地存储路径
tanjian:
  upload:
    path: ${TANJIAN_UPLOAD_PATH:./upload/}

# Diagnostics are bound to loopback on a separate port.
management:
  server:
    address: 127.0.0.1
    port: ${TANJIAN_MANAGEMENT_PORT:9081}
  endpoints:
    web:
      exposure:
        include: health,tanjian
