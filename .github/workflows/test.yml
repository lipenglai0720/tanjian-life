name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Run backend tests
        run: mvn -B -f backend/pom.xml test


  integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: integration-only
          MYSQL_DATABASE: tanjian_perf_ci
        ports: ["13306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -pintegration-only"
          --health-interval=10s --health-timeout=5s --health-retries=12
      redis:
        image: redis:7.2
        ports: ["16379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=12
    env:
      MYSQL_PWD: integration-only
      TANJIAN_RUN_INTEGRATION_TESTS: "true"
      TANJIAN_TEST_DB_URL: jdbc:mysql://127.0.0.1:13306/tanjian_perf_ci?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      TANJIAN_TEST_DB_PASSWORD: integration-only
      TANJIAN_TEST_REDIS_PORT: "16379"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Initialize isolated schema
        shell: bash
        run: |
          for file in db.sql backend/db/ai_skill_init.sql backend/db/reservation_init.sql backend/db/performance_upgrade.sql backend/db/reliability_upgrade.sql backend/db/reliability_upgrade.sql; do
            sed -E '/^[[:space:]]*USE[[:space:]]+`?hmdp`?[[:space:]]*;/Id' "$file" | mysql --protocol=TCP -h127.0.0.1 -P13306 -uroot tanjian_perf_ci
          done
      - name: Verify against real MySQL and Redis
        run: mvn -B -f backend/pom.xml -Pintegration verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: backend/target/failsafe-reports/

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Vue templates and static assets
        run: node scripts/verify_frontend.cjs
